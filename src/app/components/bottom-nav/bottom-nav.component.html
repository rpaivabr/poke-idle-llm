<nav class="bg-white rounded-2xl p-2 border border-slate-100/80 shadow-xs flex items-center justify-around">
  <!-- Ginásio Tab -->
  <button
    (click)="selectTab('gym')"
    class="flex-1 flex flex-col items-center justify-center py-2 px-3 rounded-2xl transition-all cursor-pointer select-none"
    [ngClass]="
      gameService.activeTab() === 'gym'
        ? 'bg-[#fef2f2] text-[#ef4444] font-black'
        : 'text-slate-400 hover:text-slate-600 font-bold'
    "
  >
    <span class="text-2xl mb-1 filter drop-shadow-2xs">🥊</span>
    <span class="text-[11px] tracking-wider uppercase">GINÁSIO</span>
  </button>

  <!-- Loja Tab -->
  <button
    (click)="selectTab('shop')"
    class="flex-1 flex flex-col items-center justify-center py-2 px-3 rounded-2xl transition-all cursor-pointer select-none"
    [ngClass]="
      gameService.activeTab() === 'shop'
        ? 'bg-[#eff6ff] text-[#2563eb] font-black'
        : 'text-slate-400 hover:text-slate-600 font-bold'
    "
  >
    <span class="text-2xl mb-1 filter drop-shadow-2xs">🛒</span>
    <span class="text-[11px] tracking-wider uppercase">LOJA</span>
  </button>

  <!-- Centro Tab -->
  <button
    (click)="selectTab('center')"
    class="flex-1 flex flex-col items-center justify-center py-2 px-3 rounded-2xl transition-all cursor-pointer select-none"
    [ngClass]="
      gameService.activeTab() === 'center'
        ? 'bg-[#fdf2f8] text-[#ec4899] font-black'
        : 'text-slate-400 hover:text-slate-600 font-bold'
    "
  >
    <span class="text-2xl mb-1 filter drop-shadow-2xs">🏥</span>
    <span class="text-[11px] tracking-wider uppercase">CENTRO</span>
  </button>
</nav>
