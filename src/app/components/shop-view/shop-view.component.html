<div class="bg-white rounded-2xl p-5 shadow-xs border border-slate-100 flex flex-col">
  <!-- Title -->
  <h2 class="text-2xl font-black text-[#2563eb] tracking-tight">PokéMart</h2>

  <!-- Item Grid -->
  <div class="grid grid-cols-2 gap-3 mt-4">
    @for (item of gameService.shopItems(); track item.id) {
      <div class="bg-[#f8fafc] rounded-2xl p-3 border border-slate-100/90 flex flex-col items-center justify-between text-center min-h-[148px]">
        <!-- Sprite -->
        <div class="w-10 h-10 flex items-center justify-center mb-1">
          <img 
            [src]="item.sprite" 
            [alt]="item.name"
            class="w-8 h-8 object-contain pixelated drop-shadow-xs scale-[1.3]"
          />
        </div>

        <!-- Name -->
        <h4 class="font-extrabold text-xs text-[#1e293b] leading-tight">
          {{ item.name }}
        </h4>

        <!-- Price -->
        <div class="flex items-center gap-1.5 my-1.5 font-black text-sm text-[#16a34a]">
          <span class="text-sm leading-none">💰</span>
          <span>{{ item.price }}</span>
        </div>

        <!-- Buy / Out of Money Button -->
        <button
          (click)="onBuy(item)"
          [disabled]="!gameService.canAfford(item)"
          class="w-full py-1.5 px-2 rounded-xl font-black text-xs uppercase tracking-wider transition-all select-none"
          [ngClass]="
            gameService.canAfford(item)
              ? 'bg-[#2563eb] hover:bg-[#1d4ed8] active:scale-95 text-white cursor-pointer shadow-xs'
              : 'bg-[#e2e8f0] text-slate-400 cursor-not-allowed'
          "
        >
          {{ gameService.canAfford(item) ? 'COMPRAR' : 'SEM GRANA' }}
        </button>
      </div>
    }
  </div>

  <!-- Backpack Section -->
  <div class="mt-6 pt-4 border-t border-slate-100/80">
    <h3 class="text-xs font-black text-slate-400 tracking-wider uppercase mb-2.5">
      SUA MOCHILA ({{ gameService.backpackCount() }})
    </h3>

    <div class="flex flex-wrap gap-1.5 min-h-[36px]">
      @for (item of gameService.backpack(); track $index) {
        <div class="bg-[#1e293b] text-white px-2.5 py-1 rounded-full text-xs font-bold flex items-center gap-1.5 shadow-2xs animate-pulse-subtle">
          <span>🎒</span>
          <span>{{ item.name }}</span>
        </div>
      } @empty {
        <p class="text-xs text-slate-400 italic py-1">Sua mochila está vazia.</p>
      }
    </div>
  </div>
</div>
