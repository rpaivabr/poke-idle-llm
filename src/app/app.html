<main class="w-full max-w-[400px] bg-[#f8fafc] sm:rounded-[36px] shadow-2xl border border-slate-700/30 p-4 flex flex-col justify-between min-h-[740px] relative select-none">
  <!-- Top Bar -->
  <app-top-bar class="w-full block mb-3" />

  <!-- Main Content Card according to Active Tab -->
  <div class="flex-1 flex flex-col justify-center">
    @switch (gameService.activeTab()) {
      @case ('gym') {
        <app-gym-view class="w-full block" />
      }
      @case ('shop') {
        <app-shop-view class="w-full block" />
      }
      @case ('center') {
        <app-center-view class="w-full block" />
      }
    }
  </div>

  <!-- Bottom Navigation -->
  <app-bottom-nav class="w-full block mt-3" />
</main>
